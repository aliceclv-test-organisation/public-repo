name: Error Sim Code Scanning
on:
  workflow_dispatch:
permissions:
  security-events: write
  contents: read
jobs:
  upload-bad-sarif:
    runs-on: ubuntu-latest
    steps:
      - name: Generate invalid SARIF (21 runs > limit of 20)
        run: |
          python3 - <<'PY'
          import json
          run = {"tool": {"driver": {"name": "ErrorSimTool", "version": "1.0.0", "rules": []}}, "results": []}
          sarif = {"version": "2.1.0", "$schema": "https://json.schemastore.org/sarif-2.1.0.json", "runs": [dict(run) for _ in range(21)]}
          open("bad.sarif", "w").write(json.dumps(sarif))
          print("wrote bad.sarif with", len(sarif["runs"]), "runs")
          PY
      - name: Upload invalid SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bad.sarif
